<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>AI Doll - Our dolls</title>
      <link rel="stylesheet" href="css/style.css" />
      <link rel="icon" href="images/logo.png" type="image/png" />
      <link
         rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      />
   </head>
   <body>
      <header>
         <div class="wrapper">
            <div class="web-logo">
               <img
                  src="images/logo.png"
                  alt="Logo-AI Doll"
                  class="logo-alignment"
               />
               <h1>AI Doll</h1>
            </div>
            <nav class="navbar">
               <ul>
                  <li><a href="index.html">Home</a></li>
                  <li
                     ><a href="OurDolls.html" style="font-weight: bold"
                        >Our Dolls</a
                     ></li
                  >
                  <li><a href="#">About</a></li>
                  <li><a href="#">Contact</a></li>
               </ul>
            </nav>
            <!-- Closing the wrapper div -->
         </div>
      </header>
      <main>
         <section class="pictures-of-products wrapper">
            <img
               src="images/Product1.png"
               alt="Product1"
               class="pictures-products-design-class"
               style="width: 300px"
            />
            <img
               src="images/Product2.png"
               alt="Product2"
               class="pictures-products-design-class"
               style="width: 200px"
            />
            <img
               src="images/Product3.png"
               alt="Product3"
               class="pictures-products-design-class"
               style="width: 330px"
            />
         </section>
         <section class="sect-list-dolls wrapper">
            <h3>List of dolls</h3>
            <ul class="list-dolls">
               <li>
                  <i class="fa-solid fa-rocket"></i>
                  Ace Queen Doll
               </li>
               <li>
                  <i class="fa-solid fa-rocket"></i>
                  Dr. Power Doll
               </li>
               <li>
                  <i class="fa-solid fa-rocket"></i>
                  Soccer Star Doll
               </li>
            </ul>
         </section>
         <section class="video wrapper">
            <h3>Explain Video</h3>
            <iframe
               src="https://www.youtube.com/embed/TwUJMMKx9d0?si=MKIan1oCLBq9XSFp"
               title="AI Doll Explain Video"
               frameborder="0"
               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
               referrerpolicy="strict-origin-when-cross-origin"
               allowfullscreen
            ></iframe>
         </section>
      </main>
      <footer>
         <div class="wrapper footer-container">
            <div class="column">
               <h2>Who we are</h2>
               <ul>
                  <li
                     ><a href="#" onclick="event.preventDefault()">About</a></li
                  >
                  <li><a href="#" onclick="event.preventDefault()">Team</a></li>
                  <li
                     ><a href="#" onclick="event.preventDefault()"
                        >Work With Us</a
                     ></li
                  >
               </ul>
            </div>
            <div class="column">
               <h2>Follow us</h2>
               <ul>
                  <li><a href="https://www.x.com/" target="_blank">X</a></li>
                  <li
                     ><a href="https://www.facebook.com/" target="_blank"
                        >Facebook</a
                     ></li
                  >
                  <li
                     ><a href="https://www.instagram.com/" target="_blank"
                        >Instagram</a
                     ></li
                  >
               </ul>
            </div>
         </div>
         <div class="wrapper social">
            <a href="https://www.x.com/" target="_blank">
               <i class="fab fa-x-twitter"></i>
            </a>
            <a href="https://www.facebook.com/" target="_blank">
               <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/" target="_blank">
               <i class="fab fa-instagram"></i>
            </a>
         </div>
         <div class="wrapper footer-copyright">
            <p>© 2025 AI Doll</p>
         </div>
      </footer>

</html>
